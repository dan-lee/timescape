name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions: {}

jobs:
  release:
    # Don't run this action in forks
    if: github.repository == 'dan-lee/timescape'
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing exchanges this for a short lived publish token
      id-token: write

    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # No registry-url on purpose: it writes an .npmrc referencing
      # NODE_AUTH_TOKEN, which no longer exists. npmjs.org is the default
      # registry and trusted publishing authenticates through the OIDC token.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or newer
      - name: Check npm version
        run: npm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter timescape -- test run

      - name: Create PR or publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm run release
